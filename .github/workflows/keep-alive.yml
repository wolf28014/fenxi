name: Keep Supabase Alive

on:
  schedule:
    # 每天 UTC 2:00（北京时间 10:00）执行一次
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase at $(date)..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_5M16MbXa3z5Ai2WS9SAgkQ_bC5vK0ng" \
            "https://owmbiqowhmzjledprgfw.supabase.co/rest/v1/app_config?select=id&limit=1")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Supabase is alive"
          else
            echo "⚠️ Supabase returned $RESPONSE (might be paused)"
          fi
